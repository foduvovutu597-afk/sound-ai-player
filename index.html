<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RG-SOUND</title><link rel="icon" href="cover.svg">
<style>body{margin:0;font-family:system-ui,sans-serif;background:#120c1f;color:#fff;display:flex;justify-content:center}
.w{width:100%;max-width:480px;padding:24px;box-sizing:border-box}h1{font-size:1.4rem;text-align:center;letter-spacing:2px}h1 span{color:#b388ff}
.big{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;box-shadow:0 10px 40px #0008;background:#2a2040}
.now{text-align:center;font-size:1.1rem;margin:14px 0}.bar{height:6px;background:#333;border-radius:3px;cursor:pointer}.fill{height:100%;width:0;background:#b388ff;border-radius:3px}
.t{display:flex;justify-content:space-between;font-size:.8rem;opacity:.7;margin-top:4px}.c{display:flex;justify-content:center;gap:20px;margin:16px 0;align-items:center}
button{background:#2a2040;color:#fff;border:0;border-radius:50%;width:56px;height:56px;font-size:1.3rem;cursor:pointer}button.p{width:68px;height:68px;background:#7c4dff}
ul{list-style:none;padding:0}li{display:flex;align-items:center;gap:12px;padding:8px;border-radius:10px;cursor:pointer}li:hover{background:#ffffff10}li.a{background:#7c4dff40}
li span.n{flex:1}.st,.dot{background:none;width:44px;height:44px;flex:none;font-size:1.1rem;border-radius:50%;padding:0}.st{color:#666}.st.on{color:#ffd54f}.dot::after{content:'';display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid #666}.dot.m1::after{background:#4caf50;border-color:#4caf50}.dot.m2::after{background:#ffc107;border-color:#ffc107}.dot.m3::after{background:#f44336;border-color:#f44336}
.f{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.f input{flex:1 1 100%;padding:10px;border-radius:10px;border:0;background:#2a2040;color:#fff}.ch{width:auto;height:32px;border-radius:16px;padding:0 12px;font-size:.9rem}.ch.on{background:#7c4dff}.ch i{display:inline-block;width:12px;height:12px;border-radius:50%}
li a.dl{color:#b388ff;text-decoration:none;width:44px;height:44px;line-height:44px;text-align:center;font-size:1.3rem;flex:none}
li{gap:4px}li span.n{min-width:0;overflow:hidden;text-overflow:ellipsis}.ch{height:44px;border-radius:22px;padding:0 16px}.ch i{width:16px;height:16px}
#ios{display:none;background:#1e1530;border-radius:12px;padding:8px;margin-top:8px}#ios a{display:block;padding:14px;color:#fff;background:#2a2040;border-radius:10px;margin:6px 0;text-decoration:none}
@media(max-width:420px){.w{padding:14px}li img{width:40px;height:40px}}
li img{width:44px;height:44px;border-radius:6px;object-fit:cover}</style></head><body><div class="w"><h1><span>RG-SOUND</span></h1>
<img class="big" id="big" src="cover.svg" alt=""><div class="now" id="now">Загрузка…</div>
<div class="bar" id="bar"><div class="fill" id="fill"></div></div><div class="t"><span id="cur">0:00</span><span id="dur">0:00</span></div>
<div class="c"><button id="prev">⏮</button><button class="p" id="play">▶</button><button id="next">⏭</button></div><div class="f"><input id="q" placeholder="Поиск…"><button class="ch" id="rf">↻ Обновить песни</button><button class="ch" data-f="fav">★ Избранное</button><button class="ch" data-f="1"><i style="background:#4caf50"></i></button><button class="ch" data-f="2"><i style="background:#ffc107"></i></button><button class="ch" data-f="3"><i style="background:#f44336"></i></button></div><button class="ch" id="zip" style="margin-top:8px;width:100%">⬇ Скачать выбранное</button><div class="f" id="gen"></div><div id="ios"></div><ul id="list"></ul></div>
<div id="toast" style="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#7c4dff;padding:12px 18px;border-radius:22px;opacity:0;transition:opacity .3s;pointer-events:none">.</div><audio id="au" preload="metadata"></audio>
<script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>
<script>
// Треки берутся автоматически из папки audio/, обложки — из covers/ (то же имя файла). Код править не нужно.
const REPO='foduvovutu597-afk/sound-ai-player',DEF='cover.svg',A=/\.(mp3|m4a|wav|ogg|flac)$/i,I=/\.(jpe?g|png|webp)$/i;
const au=document.getElementById('au'),$=i=>document.getElementById(i);let T=[],i=0;
const base=n=>n.replace(/\.[^.]+$/,''),enc=p=>p.split('/').map(encodeURIComponent).join('/');
async function viaApi(){const r=await fetch(`https://api.github.com/repos/${REPO}/git/trees/main?recursive=1&t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw 0;
 const tr=(await r.json()).tree.filter(x=>x.type==='blob'),m={};tr.filter(x=>I.test(x.path)&&/^(covers|audio)\//.test(x.path)).forEach(x=>m[base(x.path.split('/').pop())]??=x.path);
 const L=tr.filter(x=>/^audio\//.test(x.path)&&A.test(x.path)).map(x=>{const p=x.path.split('/'),n=p.pop();return{file:x.path,title:base(n).replace(/_/g,' '),genre:p.length>1?p[1]:'',cover:m[base(n)]||null}});
 if(!L.length)throw 0;return L.sort((a,b)=>a.file.localeCompare(b.file,'ru'))}
async function getJson(){const r=await fetch('tracks.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;return r.json()}
function setT(N){const cur=T[i]&&T[i].file,old=new Set(T.map(t=>t.file)),add=N.filter(t=>!old.has(t.file)).length;
 N.forEach(t=>{const o=T.find(x=>x.file===t.file);if(o&&o.art)t.art=o.art});T=N;const k=T.findIndex(t=>t.file===cur);i=k<0?0:k;genres();render();return add}
function toast(m){const d=$('toast');d.textContent=m;d.style.opacity=1;clearTimeout(d._t);d._t=setTimeout(()=>d.style.opacity=0,2500)}
async function refresh(user){const b=$('rf');b.disabled=true;let N=null;
 try{N=await viaApi()}catch(e){try{N=await getJson()}catch(e){}}b.disabled=false;
 if(!N){if(user)toast('Не удалось обновить список');return false}
 const first=!T.length,add=setT(N);if(user)toast(`Найдено ${T.length} треков (+${add} новых)`);if(first&&T.length&&!au.src)load(0);return true}
async function init(){try{setT(await getJson());if(T.length)load(0)}catch(e){}
 const ok=await refresh(false);if(!ok&&!T.length)$('now').textContent='Не удалось загрузить список'}
function genres(){const g=$('gen'),gs=[...new Set(T.map(t=>t.genre||'Без жанра'))].sort((a,b)=>(a==='Без жанра')-(b==='Без жанра')||a.localeCompare(b));
 [...F.g].forEach(x=>{if(!gs.includes(x))F.g.delete(x)});g.innerHTML='';if(gs.length<2)return;
 gs.forEach(x=>{const b=document.createElement('button');b.className='ch'+(F.g.has(x)?' on':'');b.textContent=x;b.onclick=()=>{F.g.has(x)?F.g.delete(x):F.g.add(x);b.classList.toggle('on');filt()};g.appendChild(b)})}
function cov(t){return t.cover?enc(t.cover):(t.art||DEF)}
function render(){const L=$('list');L.innerHTML='';T.forEach((t,k)=>{const li=document.createElement('li');li.innerHTML='<img alt=""><span class="n"></span><button class="st">★</button><button class="dot"></button><a class="dl" title="Скачать">⬇</a>';
 li.querySelector('img').src=cov(t);li.querySelector('span').textContent=t.title;deco(li,t);const a=li.querySelector('.dl');a.href=enc(t.file);a.download=t.file.split('/').pop();a.onclick=e=>e.stopPropagation();li.querySelector('.st').onclick=e=>{e.stopPropagation();S.fav[t.file]=!S.fav[t.file];save();deco(li,t);filt()};li.querySelector('.dot').onclick=e=>{e.stopPropagation();S.mark[t.file]=((S.mark[t.file]||0)+1)%4;save();deco(li,t);filt()};li.onclick=()=>{load(k);au.play()};L.appendChild(li);if(!t.cover&&!t.art)art(t,k)});mark();filt()}
function art(t,k){if(!window.jsmediatags||!/\.(mp3|m4a)$/i.test(t.file))return;
 jsmediatags.read(new URL(enc(t.file),location.href).href,{onSuccess:r=>{const p=r.tags.picture;if(!p)return;
  t.art=URL.createObjectURL(new Blob([new Uint8Array(p.data)],{type:p.format}));const im=$('list').children[k]?.querySelector('img');if(im)im.src=t.art;if(k===i)show()},onError:()=>{}})}
// Избранное и цветные метки хранятся у каждого слушателя в браузере (localStorage)
const S=Object.assign({fav:{},mark:{}},JSON.parse(localStorage.getItem('rgsound')||'{}')),F={fav:false,m:new Set(),g:new Set()};
const save=()=>localStorage.setItem('rgsound',JSON.stringify(S));
function deco(li,t){li.querySelector('.st').classList.toggle('on',!!S.fav[t.file]);li.querySelector('.dot').className='dot m'+(S.mark[t.file]||0)}
const ok=t=>{const q=$('q').value.trim().toLowerCase();return(!q||t.title.toLowerCase().includes(q))&&(!F.fav||S.fav[t.file])&&(!F.m.size||F.m.has(S.mark[t.file]||0))&&(!F.g.size||F.g.has(t.genre||'Без жанра'))};
function filt(){[...$('list').children].forEach((li,k)=>li.style.display=ok(T[k])?'':'none')}
function step(d){for(let n=1;n<=T.length;n++){const k=((i+d*n)%T.length+T.length)%T.length;if(ok(T[k]))return k}return i+d}
$('q').oninput=filt;document.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{const f=b.dataset.f;if(f==='fav')F.fav=!F.fav;else{const m=+f;F.m.has(m)?F.m.delete(m):F.m.add(m)}b.classList.toggle('on');filt()});
function mark(){[...$('list').children].forEach((li,k)=>li.classList.toggle('a',k===i))}
function show(){const t=T[i];$('big').src=cov(t);$('now').textContent=t.title;
 if('mediaSession'in navigator){const s=new URL(cov(t),location.href).href;navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:'RAMIL GR',album:"RG-SOUND",artwork:[{src:s,sizes:'512x512'}]})}}
function load(k){i=(k+T.length)%T.length;au.src=enc(T[i].file);show();mark()}
$('play').onclick=()=>au.paused?au.play():au.pause();au.onplay=()=>$('play').textContent='⏸';au.onpause=()=>$('play').textContent='▶';
$('next').onclick=()=>{load(step(1));au.play()};$('prev').onclick=()=>{load(step(-1));au.play()};au.onended=()=>{load(step(1));au.play()};
const fmt=s=>isNaN(s)?'0:00':Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
au.ontimeupdate=()=>{$('fill').style.width=(au.currentTime/au.duration*100||0)+'%';$('cur').textContent=fmt(au.currentTime);$('dur').textContent=fmt(au.duration)};
$('bar').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();au.currentTime=(e.clientX-r.left)/r.width*au.duration};
if('mediaSession'in navigator){navigator.mediaSession.setActionHandler('nexttrack',()=>$('next').onclick());navigator.mediaSession.setActionHandler('previoustrack',()=>$('prev').onclick())}
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
$('zip').onclick=async()=>{const b=$('zip'),L=T.filter(ok);if(!L.length||b.disabled)return;
 if(IOS){const p=$('ios');if(p.style.display==='block'){p.style.display='none';return}p.innerHTML='<div style="opacity:.7;font-size:.85rem">iPhone: нажимай на каждый трек → «Загрузить». Файлы будут в приложении «Файлы» → Загрузки.</div>';
  L.forEach(t=>{const a=document.createElement('a');a.href=enc(t.file);a.download=t.file.split('/').pop();a.textContent='⬇ '+t.title;p.appendChild(a)});p.style.display='block';return}
 b.disabled=true;
 for(let k=0;k<L.length;k++){b.textContent=`Скачивание ${k+1}/${L.length}…`;const a=document.createElement('a');a.href=enc(L[k].file);a.download=L[k].file.split('/').pop();
  document.body.appendChild(a);a.click();a.remove();await new Promise(r=>setTimeout(r,400))}
 b.disabled=false;b.textContent='⬇ Скачать выбранное'};
$('rf').onclick=()=>refresh(true);
init();
</script></body></html>
