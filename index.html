<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAMIL GR — Sound_AI</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(160deg,#0d0d14,#1a1030);color:#eee;min-height:100vh;display:flex;justify-content:center}
.w{width:100%;max-width:480px;padding:24px}h1{font-size:1.5rem;text-align:center;letter-spacing:2px}h1 span{color:#b388ff}
.now{text-align:center;opacity:.8;margin:8px 0 16px}.bar{height:6px;background:#333;border-radius:3px;cursor:pointer}.fill{height:100%;width:0;background:#b388ff;border-radius:3px}
.t{display:flex;justify-content:space-between;font-size:.8rem;opacity:.6;margin-top:4px}.c{display:flex;justify-content:center;gap:20px;margin:18px 0}
button{background:#2a2040;color:#fff;border:0;border-radius:50%;width:56px;height:56px;font-size:1.3rem;cursor:pointer}button.p{width:68px;height:68px;background:#7c4dff}
ul{list-style:none;padding:0}li{padding:12px 14px;margin:6px 0;background:#1c1c28;border-radius:10px;cursor:pointer}li.a{background:#3a2a66}
</style></head><body><div class="w"><h1>RAMIL GR — <span>Sound_AI</span></h1><div class="now" id="now">—</div>
<div class="bar" id="bar"><div class="fill" id="fill"></div></div><div class="t"><span id="cur">0:00</span><span id="dur">0:00</span></div>
<div class="c"><button id="prev">⏮</button><button class="p" id="play">▶</button><button id="next">⏭</button></div><ul id="list"></ul></div>
<audio id="au" preload="metadata"></audio>
<script>
// Добавляйте треки сюда: {title, id} — id файла на Google Диске (доступ «все, у кого есть ссылка»)
const TRACKS=[
 {title:"Трек 25346",id:"1BmY0-laDB4R6oFJzfo1Dtj2sKT5X-fcT"},
 {title:"Трек 54471",id:"1GaL9IPRzAYzyC0AC8-PZTNbEiNa4YYSe"},
 {title:"Трек 68798",id:"1cq2ytIdQdAEZuQXsP8SnTAJYLtlNncJr"},
];
const src=id=>`audio/${id}.m4a`;
const au=document.getElementById('au'),$=i=>document.getElementById(i);let i=0;
const fmt=s=>isFinite(s)?Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"):"0:00";
TRACKS.forEach((t,k)=>{const li=document.createElement('li');li.textContent=t.title;li.onclick=()=>{load(k);au.play()};$('list').appendChild(li)});
function load(k){i=(k+TRACKS.length)%TRACKS.length;au.src=src(TRACKS[i].id);$('now').textContent=TRACKS[i].title;
 [...$('list').children].forEach((l,n)=>l.classList.toggle('a',n==i))}
$('play').onclick=()=>au.paused?au.play():au.pause();$('next').onclick=()=>{load(i+1);au.play()};$('prev').onclick=()=>{load(i-1);au.play()};
au.onplay=()=>$('play').textContent='⏸';au.onpause=()=>$('play').textContent='▶';au.onended=()=>{load(i+1);au.play()};
au.ontimeupdate=()=>{$('fill').style.width=(au.currentTime/au.duration*100||0)+'%';$('cur').textContent=fmt(au.currentTime);$('dur').textContent=fmt(au.duration)};
$('bar').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();au.currentTime=(e.clientX-r.left)/r.width*au.duration};
load(0);
</script></body></html>
