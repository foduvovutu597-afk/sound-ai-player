// Обложка из mp3: свой парсер ID3v2 (APIC/PIC) через Range-запрос, запасной вариант — jsmediatags
async function id3pic(url){const h=new Uint8Array(await (await fetch(url,{headers:{Range:'bytes=0-9'}})).arrayBuffer());
 if(h[0]!==73||h[1]!==68||h[2]!==51)return null;const v=h[3],sz=((h[6]&127)<<21)|((h[7]&127)<<14)|((h[8]&127)<<7)|(h[9]&127);

 while(p+10<b.length){const id=s(p,v===2?3:4);if(!/^[A-Z0-9]{3,4}$/.test(id))break;let n,hl;
  if(v===2){n=b[p+3]<<16|b[p+4]<<8|b[p+5];hl=6}else{n=v===4?((b[p+4]&127)<<21|(b[p+5]&127)<<14|(b[p+6]&127)<<7|(b[p+7]&127)):(b[p+4]<<24|b[p+5]<<16|b[p+6]<<8|b[p+7]);hl=10}
  if(id==='APIC'||id==='PIC'){const f=b.subarray(p+hl,p+hl+n),e=f[0];let q=1,mime;
   if(id==='PIC'){mime='image/'+(s(p+hl+1,3).toLowerCase()==='png'?'png':'jpeg');q=4}else{while(f[q])q++;mime=String.fromCharCode(...f.subarray(1,q))||'image/jpeg';q++}
   q++;if(e===1||e===2){while(q<f.length-1&&(f[q]||f[q+1]))q+=2;q+=2}else{while(q<f.length&&f[q])q++;q++}
   if(!mime.includes('/'))mime='image/'+(mime.toLowerCase()==='png'?'png':'jpeg');let d=f.subarray(q);for(let z=0;z<Math.min(256,d.length-3);z++){if((d[z]===255&&d[z+1]===216&&d[z+2]===255)||(d[z]===137&&d[z+1]===80&&d[z+2]===78&&d[z+3]===71)){d=d.subarray(z);break}}return new Blob([d],{type:mime})}
  p+=hl+n}return null}

 b.disabled=true;

const EK='rgsound_enc';let SESS=sessionStorage.getItem('rgsound_sess')||null;

const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pkey(pin,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}

 if(!t||!t.trim())return;const tok=t.trim();if(confirm('Защитить токен PIN-кодом из 4 цифр? (OK — да, Отмена — хранить без PIN)'))setPin(tok).then(ok=>{if(ok)unlock(tok)});else{localStorage.setItem('rgsound_token',tok);unlock(tok)}}
function showQR(){const url=location.origin+location.pathname+'#owner='+encodeURIComponent(TK());const q=qrcode(0,'L');q.addData(url);q.make();
 modal('<b>📱 Наведи камеру телефона</b>'+q.createSvgTag({cellSize:4,margin:4,scalable:true}).replace('<svg','<svg style="background:#fff;width:100%;height:auto;border-radius:8px"')+'<small>В QR-коде твой ключ — никому не показывай. На телефоне попросит придумать PIN.</small><button onclick="this.closest(\'div[style]\').parentNode.remove()">Закрыть</button>')}

 if(TK()){const o=modal('<b>Режим владельца</b><button id="mq">📱 QR для телефона</button><button id="mv">🖼 Обложки из mp3</button>'+(localStorage.getItem('rgsound_token')?'<button id="mp">🔒 Защитить PIN-кодом</button>':'')+'<button id="ml">Выйти (удалить токен)</button><button id="mc">Закрыть</button>');
  o.querySelector('#mv').onclick=()=>{o.remove();coversFromMp3()};o.querySelector('#mq').onclick=()=>{o.remove();showQR()};o.querySelector('#mc').onclick=()=>o.remove();
  const mp=o.querySelector('#mp');if(mp)mp.onclick=async()=>{o.remove();const t=TK();if(await setPin(t)){unlock(t);toast('Токен защищён PIN')}};
  o.querySelector('#ml').onclick=()=>{if(confirm('Выйти и удалить токен из этого браузера?')){logout();o.remove()}};return}
 if(localStorage.getItem(EK)){for(;;){const a=await askPin('Введи PIN владельца','<button id="pm">Вставить токен вручную</button><button id="px">Забыть токен</button>');
   if(!a)return;const r=await encOpen(a.v);if(typeof r==='string'){a.o.remove();unlock(r);toast('Режим владельца включён');return}
   a.o.remove();if(r===false){alert('5 неверных попыток — токен удалён. Отсканируй QR заново.');return}alert('Неверный PIN. Осталось попыток: '+r)}}
 manual()};

async function gh(p,o={}){const r=await fetch('https://api.github.com/repos/'+REPO+p,{...o,headers:{Authorization:'Bearer '+TK(),Accept:'application/vnd.github+json'},cache:'no-store'});
 if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,120));return r.json()}
async function commit(changes,msg){ // changes: [{path, sha|null}] ; then tracks.json regenerated
 const ref=await gh('/git/ref/heads/main'),c=await gh('/git/commits/'+ref.object.sha),tr=(await gh(`/git/trees/${c.tree.sha}?recursive=1`)).tree;
 const blobs=new Map(tr.filter(x=>x.type==='blob').map(x=>[x.path,x.sha]));changes.forEach(ch=>ch.sha?blobs.set(ch.path,ch.sha):blobs.delete(ch.path));
 const paths=[...blobs.keys()],m={};paths.filter(p=>I.test(p)&&/^(covers|audio)\//.test(p)).forEach(p=>m[base(p.split('/').pop())]??=p);
 const list=paths.filter(p=>/^audio\//.test(p)&&A.test(p)).sort((a,b)=>a.localeCompare(b,'ru')).map(p=>{const q=p.split('/'),n=q.pop();return{file:p,title:base(n).replace(/_/g,' '),genre:q.length>1?q[1]:'',cover:m[base(n)]||null}});
 const tree=changes.map(ch=>({path:ch.path,mode:'100644',type:'blob',sha:ch.sha})).concat([{path:'tracks.json',mode:'100644',type:'blob',content:JSON.stringify(list,null,1)}]);
 const nt=await gh('/git/trees',{method:'POST',body:JSON.stringify({base_tree:c.tree.sha,tree})});
 const nc=await gh('/git/commits',{method:'POST',body:JSON.stringify({message:msg,tree:nt.sha,parents:[c.sha]})});
 await gh('/git/refs/heads/main',{method:'PATCH',body:JSON.stringify({sha:nc.sha})});return list}
function shaOf(p){return gh('/contents/'+enc(p)+'?ref=main').then(x=>x.sha)}
async function renameT(t){const old=base(t.file.split('/').pop()),n=prompt('Новое название трека:',old);if(!n||n.trim()===old)return;const nn=n.trim().replace(/[\/\\]/g,'-');
 const dir=t.file.slice(0,t.file.lastIndexOf('/')+1),ext=t.file.slice(t.file.lastIndexOf('.'));try{toast('Сохраняю…');
  const ch=[{path:dir+nn+ext,sha:t.sha||await shaOf(t.file)},{path:t.file,sha:null}];
  if(t.cover&&base(t.cover.split('/').pop())===old){const cd=t.cover.slice(0,t.cover.lastIndexOf('/')+1),ce=t.cover.slice(t.cover.lastIndexOf('.'));ch.push({path:cd+nn+ce,sha:await shaOf(t.cover)},{path:t.cover,sha:null})}
  for(const k of['fav','mark'])if(S[k][t.file]){S[k][dir+nn+ext]=S[k][t.file];delete S[k][t.file]}save();
  const L=await commit(ch,'Rename '+old+' → '+nn);const cur=T[i]&&T[i].file===t.file;setT(L);if(cur){const k=T.findIndex(x=>x.file===dir+nn+ext);if(k>=0){i=k;show();mark()}}toast('Переименовано. На сайте через 1–2 мин')}catch(e){alert('Ошибка: '+e.message)}}
function jpeg500(bl){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,500/Math.max(im.width,im.height)),c=document.createElement('canvas');
 c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(im.src);c.toBlob(b=>b?res(b):rej(),'image/jpeg',.85)};im.onerror=rej;im.src=URL.createObjectURL(bl)})}
const b64blob=bl=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(bl)});
async function coversFromMp3(){const need=T.filter(t=>!(t.cover&&/^covers\//.test(t.cover))&&/\.(mp3|m4a)$/i.test(t.file));
 if(!need.length){alert('У всех треков уже есть обложки в covers/');return}
 const o=modal('<b>🖼 Обложки из mp3</b><div id="cp">Готовлю…</div>');const P=o.querySelector('#cp'),ch=[];let n=0,none=0;
 try{for(const t of need){n++;P.textContent=`Читаю ${n} из ${need.length}: ${t.title}`;const bl=await getArt(t);if(!bl){none++;continue}
   const j=await jpeg500(bl).catch(()=>bl),r=await gh('/git/blobs',{method:'POST',body:JSON.stringify({content:await b64blob(j),encoding:'base64'})});
   ch.push({path:'covers/'+base(t.file.split('/').pop())+'.jpg',sha:r.sha})}
  if(!ch.length){P.textContent='В mp3 не нашлось встроенных обложек ('+none+')';}
  else{P.textContent='Сохраняю на GitHub…';const L=await commit(ch,'Covers from mp3 ('+ch.length+')');setT(L);P.textContent=`Готово: добавлено обложек ${ch.length}`+(none?`, без обложки в mp3: ${none}`:'')+'. На сайте через 1–2 мин.'}}
 catch(e){P.textContent='Ошибка: '+e.message}
 o.querySelector('div').insertAdjacentHTML('beforeend','<button onclick="this.closest(\'.mdl\').parentNode.remove()">Закрыть</button>')}
async function deleteT(t){if(!confirm('Удалить «'+t.title+'» из плеера навсегда?'))return;try{toast('Удаляю…');
  const ch=[{path:t.file,sha:null}];if(t.cover&&base(t.cover.split('/').pop())===base(t.file.split('/').pop()))ch.push({path:t.cover,sha:null});
  const L=await commit(ch,'Delete '+t.title);setT(L);toast('Удалено')}catch(e){alert('Ошибка: '+e.message)}}
